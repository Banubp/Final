<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Portfolio layout review</title><style>body{margin:0;background:#e8e8e8;font:14px system-ui;color:#262626}header{padding:16px;display:flex;gap:20px;align-items:center;flex-wrap:wrap}label{display:flex;gap:8px;align-items:center}select{padding:8px}main{display:flex;justify-content:center;padding:0 16px 20px;overflow:auto}iframe{flex-shrink:0;width:375px;height:850px;border:1px solid #bbb;background:#f7f7f7}h1{font-size:16px;margin:0}</style></head><body><header><h1>Portfolio layout review</h1><label>Page<select id="page"><option value="index.html">Landing page</option><option value="case-study-spillmate.html">Spillmate</option><option value="case-study-active-luton.html">Active Luton</option><option value="case-study-bookingcom.html">Booking.com</option><option value="case-study-nexa.html">Nexa</option><option value="project-hobbyghar.html">Hobby Ghar</option></select></label><label>Width<select id="width"><option>320</option><option selected>375</option><option>430</option><option>768</option><option>1024</option><option>1366</option></select></label></header><main><iframe id="preview" title="Portfolio preview" src="./index.html?review=3"></iframe></main><script>const frame=document.getElementById('preview');document.getElementById('page').addEventListener('change',e=>frame.src='./'+e.target.value+'?review=3');document.getElementById('width').addEventListener('change',e=>frame.style.width=e.target.value+'px');</script></body></html>
